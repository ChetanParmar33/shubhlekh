# Netlify: static site in public/ (built by scripts/netlify-build.mjs) + one function for the API.
[build]
  command = "npm run build:netlify"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # read at runtime by the API: design pages/configs, the design photo list, the SPA shell
  included_files = ["samples/*/index.html", "samples/*/config.js", "samples/assets.json", "web/dist/index.html"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/i/*"
  to = "/.netlify/functions/api/i/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200
  force = true

# account area is client-side routed
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/t/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/core/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
